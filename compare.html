<!doctype html>
<html lang="zh-Hant-TW" data-auth="pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="ThreadsInsight 多帳號比較：並排比較 2～4 個合成資料分析任務。"
    />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@300&display=swap"
    />
    <title>多帳號比較｜ThreadsInsight</title>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要內容</a>

    <header class="top-nav">
      <div class="container top-nav-inner">
        <a class="wordmark" href="/">ThreadsInsight</a>
        <div class="top-nav-end">
          <span class="badge-pill">Mock Dataset</span>
          <div id="account" class="account" hidden>
            <span class="account-email" id="account-email"></span>
            <button id="sign-out" class="button-outline account-sign-out" type="button">
              登出
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="compare-title">
        <div class="container hero-inner">
          <p class="caption-uppercase"><a class="back-link" href="/">← 回到分析</a></p>
          <h1 id="compare-title" class="hero-title">多帳號比較</h1>
          <p class="hero-lead">
            勾選 2～4
            個已完成的分析任務，並排比較平均互動、互動率、發文頻率、主力貼文長度與最佳貼文類型。
          </p>

          <form id="compare-form" class="compare-form">
            <fieldset class="compare-fieldset" aria-describedby="compare-count">
              <legend>選擇要比較的任務</legend>
              <p id="compare-count" class="hint" aria-live="polite">已選 0／4 個（至少 2 個）</p>
              <div id="compare-picker" aria-busy="true">
                <p class="task-empty">載入中…</p>
              </div>
            </fieldset>
            <button id="compare-submit" class="button-primary" type="submit" disabled>
              開始比較
            </button>
          </form>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section
        id="compare-result"
        class="compare-result container"
        aria-label="比較結果"
        hidden
      ></section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          ThreadsInsight 僅使用確定性合成資料（Mock Dataset）。比較結果不代表任何帳號的真實表現。
        </p>
      </div>
    </footer>

    <script type="module" src="/src/compare.ts"></script>
  </body>
</html>
