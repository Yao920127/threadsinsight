# ThreadsInsight 本機一鍵啟動（ADR-001：先做本機 docker-compose）。
#
#   1. supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor
#   2. cp .env.example .env（填入需要的值）
#   3. docker compose up --build
#   4. 打開 http://localhost:8080
#
# Supabase 由 Supabase CLI 在本機另外啟動（不在這個 compose 內）；容器透過 host.docker.internal 連線。

name: threadsinsight

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # 容器內的 127.0.0.1 是容器自己，改用 host.docker.internal 連本機 Supabase
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
      # token 的 iss 是瀏覽器使用的網址，與容器內連線用的網址不同
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-http://127.0.0.1:54321/auth/v1}
      # 後端以 publishable key＋使用者 token 存取資料庫（RLS），不需要任何 Supabase 密鑰
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:?set VITE_SUPABASE_PUBLISHABLE_KEY in .env}}
      THREADSINSIGHT_AI: ${THREADSINSIGHT_AI:-auto}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 不對外開放埠號，只有 web 服務能連到
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?set VITE_SUPABASE_PUBLISHABLE_KEY in .env}
    environment:
      CSP_CONNECT_SRC: ${VITE_SUPABASE_URL}
    ports:
      # 只綁定本機，不對區網開放
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    # 唯讀檔案系統下，nginx（uid 101）只需要能寫暫存檔與啟動時產生的設定檔
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
