# ThreadsInsight 本機完整啟動（選用；日常開發只跑單元測試，見 README）。
#
#   docker compose up --build
#   打開 http://localhost:8080
#
# 包含 Postgres、資料庫遷移、API 與網站。資料存在名為 threadsinsight_db 的 volume，
# `docker compose down -v` 會連同資料一起刪除。正式環境在 Railway（見 docs/architecture.md）。

name: threadsinsight

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: threadsinsight
      # 只供本機使用；不對外開放埠號
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local-dev-only}
      POSTGRES_DB: threadsinsight
    volumes:
      - threadsinsight_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadsinsight -d threadsinsight"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    environment:
      PGHOST: db
      PGUSER: threadsinsight
      PGPASSWORD: ${LOCAL_DB_PASSWORD:-local-dev-only}
      PGDATABASE: threadsinsight
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://threadsinsight:${LOCAL_DB_PASSWORD:-local-dev-only}@db:5432/threadsinsight
      # 本機走 http，cookie 不能加 Secure（正式環境預設為 true）
      COOKIE_SECURE: "false"
      THREADSINSIGHT_AI: ${THREADSINSIGHT_AI:-auto}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      # 只綁定本機，不對區網開放
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    # 唯讀檔案系統下，nginx（uid 101）只需要能寫暫存檔與啟動時產生的設定檔
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  threadsinsight_db:
